<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Advisor — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#050a14;--card:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.1);
    --accent:#00d4aa;--accent2:#7b61ff;--text:#e8eaf0;--muted:#7a8299;
    --danger:#ff4d6d;--success:#00d4aa;
  }
  body{
    font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background-image:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(0,212,170,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 90%, rgba(123,97,255,0.08) 0%, transparent 60%);
  }
  .container{width:100%;max-width:440px;padding:20px;}
  .logo{text-align:center;margin-bottom:32px;}
  .logo-icon{
    width:56px;height:56px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-radius:16px;display:inline-flex;align-items:center;justify-content:center;
    font-size:24px;margin-bottom:12px;box-shadow:0 8px 32px rgba(0,212,170,0.3);
  }
  .logo h1{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;letter-spacing:-0.5px;}
  .logo h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .logo p{color:var(--muted);font-size:13px;margin-top:4px;}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:20px;
    padding:36px;backdrop-filter:blur(20px);
    box-shadow:0 24px 64px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .card h2{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;margin-bottom:4px;}
  .card p.sub{color:var(--muted);font-size:13px;margin-bottom:28px;}
  .flash{
    padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:18px;
    background:rgba(255,77,109,0.1);border:1px solid rgba(255,77,109,0.3);color:#ff8fa3;
  }
  .flash.success{background:rgba(0,212,170,0.1);border-color:rgba(0,212,170,0.3);color:var(--accent);}
  .form-group{margin-bottom:18px;}
  label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.6px;}
  input{
    width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);
    border:1px solid var(--border);border-radius:12px;color:var(--text);
    font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:all 0.2s;
  }
  input:focus{border-color:var(--accent);background:rgba(0,212,170,0.05);box-shadow:0 0 0 3px rgba(0,212,170,0.1);}
  input::placeholder{color:var(--muted);}
  .btn{
    width:100%;padding:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;border-radius:12px;color:#fff;font-family:'Syne',sans-serif;
    font-size:14px;font-weight:700;letter-spacing:0.5px;cursor:pointer;
    transition:all 0.2s;margin-top:4px;
  }
  .btn:hover{opacity:0.9;transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,212,170,0.3);}
  .link{text-align:center;margin-top:20px;font-size:13px;color:var(--muted);}
  .link a{color:var(--accent);text-decoration:none;font-weight:500;}
  .link a:hover{text-decoration:underline;}
  .divider{border:none;border-top:1px solid var(--border);margin:20px 0;}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <div class="logo-icon">💹</div>
    <h1>Smart <span>Advisor</span></h1>
    <p>Your AI-powered investment companion</p>
  </div>
  <div class="card">
    <h2>Welcome back</h2>
    <p class="sub">Sign in to your account</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {% if cat=='success' %}success{% endif %}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <div class="form-group">
        <label>Email or Username</label>
        <input type="text" name="identifier" placeholder="Enter email or username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn">Sign In →</button>
    </form>
    <div class="link">Don't have an account? <a href="/register">Create one</a></div>
  </div>
</div>
</body>
</html>
